; SpotMicro firmware (Arduino on ESP32-S3), built step by step.
; Each step is its own program (environment) so it can be flashed and tested on its own:
;   pio run -e i2c_scan -t upload -t monitor
;   pio run -e servo_tool -t upload -t monitor

[platformio]
default_envs = servo_tool

[env]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
framework = arduino
monitor_speed = 115200
monitor_echo = yes          ; show what you type in the serial monitor
build_flags =
    -D SDA_PIN=21
    -D SCL_PIN=47
    ; Serial over the ESP32-S3's native USB port (USB-JTAG/serial, shows up as /dev/ttyACM*).
    ; Comment out if your board connects through a USB-UART chip (/dev/ttyUSB*) instead.
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Step 1: find the PCA9685 and sensors on the I2C bus
[env:i2c_scan]
build_src_filter = +<i2c_scan.cpp>

; Step 2: drive servos by hand from the serial monitor (also a WiFi-free calibration tool)
[env:servo_tool]
build_src_filter = +<servo_tool.cpp>
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
